{% extends 'core/base.html' %}

{% block content %}
<section class="min-h-[80vh] flex items-center justify-center py-12 px-4">
    <div class="bg-white p-8 md:p-10 rounded-sm shadow-xl max-w-lg w-full border border-rebiumGold/20">
        <!-- Título principal -->
        <h2 class="text-2xl md:text-3xl font-serif text-rebiumBurgundy border-b border-rebiumGold/30 pb-4 mb-6 tracking-wide uppercase font-bold">
            Agregar Nueva Categoría
        </h2>

        <form method="post" novalidate class="space-y-6">
            {% csrf_token %}

            {% for field in form %}
                <div>
                    <label for="{{ field.id_for_label }}" class="block text-xs font-semibold uppercase tracking-wider text-rebiumDark mb-2">
                        {{ field.label }}
                    </label>
                    
                    {{ field }}

                    {% if field.errors %}
                        <div class="text-red-600 text-xs mt-1 tracking-wide">
                            {{ field.errors|striptags }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <!-- Botones de Acción -->
            <div class="flex items-center justify-between pt-6 border-t border-gray-100 mt-8">
                <a href="{% url 'dashboard' %}" class="text-xs uppercase tracking-widest text-gray-400 hover:text-rebiumDark font-semibold transition-colors duration-200">
                    Cancelar
                </a>
                
                <button type="submit" class="bg-rebiumBurgundy text-rebiumBg px-6 py-2.5 text-xs font-semibold uppercase tracking-widest rounded-sm hover:opacity-90 transition-all duration-300 shadow-md">
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</section>
{% endblock %}

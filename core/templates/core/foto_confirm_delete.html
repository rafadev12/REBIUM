{% extends 'core/base.html' %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-20">
    <div class="bg-white p-8 shadow-2xl border border-red-200 rounded text-center">
        <h2 class="font-cinzel text-xl font-bold text-rebiumBright mb-4">¿Eliminar Obra?</h2>
        <p class="text-sm text-stone-600 mb-6">
            ¿Estás seguro de que deseas eliminar permanentemente la fotografía <strong>"{{ foto.titulo }}"</strong>? Esta acción no se puede deshacer.
        </p>

        <form method="post" class="flex justify-center gap-4">
            {% csrf_token %}
            <a href="{% url 'dashboard' %}" class="px-4 py-2 border border-stone-300 text-stone-600 text-xs uppercase tracking-widest rounded hover:bg-stone-100">Cancelar</a>
            <button type="submit" class="px-4 py-2 bg-rebiumBright text-white text-xs uppercase tracking-widest rounded font-semibold hover:bg-red-700">Eliminar</button>
        </form>
    </div>
</section>
{% endblock %}
